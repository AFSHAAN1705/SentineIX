{% extends "base.html" %}
{% block content %}
<div class="error-stage">
  <p class="mono text-danger">500</p>
  <h2 class="glitch">SYSTEM FAULT</h2>
  <p>Internal error detected. The transaction was rolled back.</p>
  <a class="btn btn-cyan" href="{{ current_user.dashboard_endpoint if current_user.is_authenticated else url_for('auth.login') }}">Return to Dashboard</a>
</div>
{% endblock %}
