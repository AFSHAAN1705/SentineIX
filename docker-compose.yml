version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-sentinelx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentinelx_pass}
      POSTGRES_DB: ${DB_NAME:-sentinelx_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-sentinelx}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelx_api
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sentinelx}
      DB_PASSWORD: ${DB_PASSWORD:-sentinelx_pass}
      DB_NAME: ${DB_NAME:-sentinelx_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_production}
      JWT_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      CLIENT_URL: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx_web
    restart: always
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads_data:
